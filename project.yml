name: Songmilim
options:
  bundleIdPrefix: com.songmilim
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: he
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Songmilim:
    type: application
    platform: iOS
    sources:
      - path: Songmilim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(APP_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: Songmilim/Songmilim.entitlements
      properties:
        com.apple.developer.homekit: true
    info:
      path: Songmilim/Info.plist
      properties:
        CFBundleDisplayName: Songmilim
        CFBundleDevelopmentRegion: he
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSHomeKitUsageDescription: "כדי לשלוט באביזרי הבית החכם שלך (אורות, מנעול ועוד)."
        NSAppleMusicUsageDescription: "כדי לחפש ולנגן מוזיקה מ-Apple Music."
        NSMicrophoneUsageDescription: "כדי לזהות שירים עם Shazam. ההקלטה לא נשמרת."
        NSLocalNetworkUsageDescription: "כדי למצוא את רמקולי ה-Sonos ברשת הביתית ולשלוט בהם."
        NSFaceIDUsageDescription: "כדי לנעול את האפליקציה ולאשר פתיחת מנעולים."
        NSBonjourServices:
          - _sonos._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
